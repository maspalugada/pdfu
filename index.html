<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Editor PDF Sederhana</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #editor { flex-grow: 1; border: none; padding: 1em; font-size: 16px; resize: none; }
        #controls { padding: 1em; background: #f0f0f0; text-align: right; }
        button { font-size: 16px; padding: 0.5em 1em; }
    </style>
</head>
<body>
    <textarea id="editor" placeholder="Ketik konten Anda di sini..."></textarea>
    <div id="controls">
        <button id="save-button">Simpan sebagai PDF</button>
    </div>
    <script src="./renderer.js"></script>
</body>
</html>
